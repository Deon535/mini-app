<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Исламские книги</title>

  <!-- Шрифты: Alegreya (заголовки), Onest (интерфейс), Amiri (арабский), Literata (чтение) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700&family=Amiri:wght@400;700&family=Literata:opsz,wght@7..72,400;7..72,600&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Шрифты книг Bayt al-Magrifa (как в их PDF): Source Serif (текст), Montserrat (шапка страницы), Anton (номер страницы, замена Impact) -->
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,700;1,8..60,400;1,8..60,700&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Anton&text=0123456789&display=swap" rel="stylesheet">
  <!-- PT Serif: шрифт PDF-книг, сделанных из Word (например, «Учёные комитета против мурджиитов») -->
  <link href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <!-- PT Sans: шрифт PDF-книги №83 «Убеждения приверженцев Сунны» -->
  <link href="https://fonts.googleapis.com/css2?family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Caladea:ital,wght@0,400;0,700;1,400;1,700&family=Carlito:ital,wght@0,400;0,700;1,400;1,700&family=Tinos:ital,wght@0,400;0,700;1,400;1,700&family=Arimo:ital,wght@0,400;0,700;1,400;1,700&family=Gelasio:ital,wght@0,400;0,700;1,400;1,700&family=Source+Sans+3:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300&display=swap" rel="stylesheet">
  <!-- Детские книги №116, №117 (замены платных шрифтов PDF): Lobster, Didact Gothic, Comfortaa, Bebas Neue; арабский — Estedad, как в PDF -->
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Comfortaa:wght@400;700&family=Didact+Gothic&family=Estedad:wght@300;500;700&family=Lobster&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">

  <!-- Скрипт Telegram: тема, кнопка «Назад», вибрация, облако. Вне Telegram просто ничего не делает -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body data-theme="light">

  <!-- Сюда app.js вставляет текущий экран -->
  <main id="app"></main>

  <!-- Нижнее меню: три вкладки -->
  <nav class="tabbar" id="tabbar"></nav>

  <!-- Выезжающая панель «Оформление» -->
  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet"></div>

  <!-- Сначала данные, потом логика -->
  <script src="data/books.js"></script>
  <script src="data/sample-chapter.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
